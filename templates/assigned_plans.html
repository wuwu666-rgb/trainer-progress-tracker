{% extends "base.html" %}
{% block content %}
<div class="workspace-page">
  <div class="workspace-heading">
    <h1>My workouts</h1>
    <p>Open a plan to see the exercises and targets from your trainer.</p>
    <div class="workspace-actions">
      <a class="button workspace-secondary" href="{{ url_for('clients.invitations') }}">Trainer invitations</a>
    </div>
  </div>
  <div class="workspace-list">
    {% for plan in plans %}
    <a class="workspace-card workspace-row-link" href="{{ url_for('planning.plan_detail', plan_id=plan.id) }}">
      <span>{{ plan.name }}</span>
      <span aria-hidden="true">›</span>
    </a>
    {% else %}
    <p class="workspace-empty">No workouts have been assigned to you yet.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
