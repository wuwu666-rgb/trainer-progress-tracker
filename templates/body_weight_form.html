{% extends "base.html" %}
{% block content %}
<div class="workspace-page workspace-form-page">
  <a class="button workspace-secondary" href="{{ url_for('history.body_weights', client_id=client.id) }}">← Body-weight history</a>
  <div class="workspace-heading">
    <h1>{{ 'Edit body weight' if entry else 'Record body weight' }}</h1>
    <p>{{ client.name }}</p>
  </div>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if entry %}<input type="hidden" name="revision" value="{{ revision }}">{% endif %}
    <label>Date <input type="date" name="measurement_date" max="{{ today }}" value="{{ measurement_date }}" required></label>
    <label>Body weight (lb) <input type="number" inputmode="decimal" name="weight_lb" min="0" step="any" value="{{ weight }}" required></label>
    <button type="submit">{{ 'Save changes' if entry else 'Save measurement' }}</button>
  </form>
</div>
{% endblock %}
