{% extends "base.html" %}
{% block content %}
<h1>{{ title }}</h1>
<section>
  <h2>{{ g.user.name }}</h2>
  <p>{{ g.user.role|capitalize }} account</p>
  <form class="logout-form" method="post" action="{{ url_for('auth.logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit">Log out</button>
  </form>
</section>
{% endblock %}
