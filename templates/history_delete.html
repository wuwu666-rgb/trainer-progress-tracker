{% extends "base.html" %}
{% from "workout_summary.html" import workout_summary %}
{% block content %}
<div class="workspace-page workspace-form-page">
  <div class="workspace-heading">
    <h1>Delete training record</h1>
    <p>{{ client.name }}</p>
  </div>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <strong>{{ workout.exercise }}</strong>
    {{ workout_summary(workout) }}
    <p>This record will be permanently removed from training history.</p>
    <button type="submit">Confirm deletion</button>
  </form>
  <div class="workspace-actions">
    <a class="button workspace-secondary" href="{{ url_for('history.index', client_id=client.id, q=request.args.get('q') or none) }}">Cancel</a>
  </div>
</div>
{% endblock %}
