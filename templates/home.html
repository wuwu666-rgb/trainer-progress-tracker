{% extends "base.html" %}
{% block content %}
<h1>Trainer dashboard</h1>
<p>Welcome, {{ g.user.name }}.</p>
<div class="dashboard-cards">
  <section>
    <h2>Clients</h2>
    <p>Open a client profile to record a workout or review training history.</p>
    <a class="button" href="{{ url_for('clients.index') }}">Open client list</a>
  </section>
  <section>
    <h2>Workout plans</h2>
    <p>Create and review reusable workout templates.</p>
    <a class="button" href="{{ url_for('planning.index') }}">Open workout plans</a>
  </section>
</div>
{% endblock %}
