{% extends "base.html" %}
{% block content %}
<div class="workspace-page">
  <div class="workspace-heading">
    <h1>Trainer dashboard</h1>
    <p>Welcome, {{ g.user.name }}.</p>
  </div>
  <h2 class="workspace-section-title">Overview</h2>
  <div class="workspace-list">
    <section class="workspace-card">
      <dl class="dashboard-overview">
        <div><dt>Client profiles</dt><dd>{{ overview.clients }}</dd></div>
        <div><dt>Pending invitations</dt><dd>{{ overview.invitations }}</dd></div>
        <div><dt>Unassigned plans</dt><dd>{{ overview.plans }}</dd></div>
      </dl>
    </section>
  </div>
</div>
{% endblock %}
